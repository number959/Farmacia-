# Compila GestionaleFarmacia.exe su Windows, lo prova e lo rende scaricabile (Actions > esecuzione > Artifacts).
name: Exe Windows

on:
  push:
    paths:
      - 'server/**'
      - 'js/**'
      - 'css/**'
      - 'index.html'
      - 'vendor/**'
      - 'strumenti/**'
      - 'installazione/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/exe-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      - name: Dipendenze
        run: npm ci

      - name: Prove sui sorgenti
        run: npm test

      - name: Compila l'exe
        run: node strumenti/compila-exe.js

      - name: Prove sull'exe compilato
        shell: pwsh
        run: |
          $env:GF_ESEGUIBILE = Join-Path $PWD 'dist\GestionaleFarmacia\GestionaleFarmacia.exe'
          node --test --test-timeout=120000 tests/server.test.js

      - name: Prova dell'installazione come servizio
        shell: pwsh
        run: |
          Copy-Item -Recurse dist\GestionaleFarmacia C:\GestionaleFarmacia
          & C:\GestionaleFarmacia\installa-servizio.ps1 -Porta 8080
          if ($LASTEXITCODE -ne 0) { throw "Installazione non riuscita ($LASTEXITCODE)" }
          $t0 = Get-Date
          $stato = Invoke-RestMethod http://localhost:8080/api/stato
          "Risposta da localhost in $([int]((Get-Date) - $t0).TotalMilliseconds) ms"
          if ($stato.versione -ne '3.0.0') { throw "Il servizio non risponde come previsto" }
          $att = Get-ScheduledTask -TaskName 'Gestionale Farmacia'
          $att | Format-List TaskName, State
          if ($att.Triggers.Count -ne 2) { throw "Servono due avvii: all'accensione e il controllo ogni 5 minuti" }
          if ($att.Actions[0].Arguments -notmatch '--servizio') { throw "Manca --servizio" }
          icacls C:\GestionaleFarmacia
          Get-ChildItem C:\GestionaleFarmacia\dati
          # accesso d'emergenza con il servizio in funzione: crea prima l'amministratore dal server
          Invoke-RestMethod -Method Post http://localhost:8080/api/setup -Headers @{ 'X-Richiesta' = '1' } -ContentType 'application/json' -Body '{"username":"admin","nome":"Amministratore","password":"Password-123"}' | Out-Null
          $uscita = & C:\GestionaleFarmacia\GestionaleFarmacia.exe --reimposta-password admin --servizio | Out-String
          $uscita
          if ($uscita -notmatch 'provvisoria per "admin"') { throw "Accesso d'emergenza non riuscito" }
          # una seconda copia sulla stessa porta deve uscire subito (niente "Premi Invio" sotto il servizio)
          $p = Start-Process -FilePath C:\GestionaleFarmacia\GestionaleFarmacia.exe -ArgumentList '--porta 8080 --servizio --dati C:\gf-prova-porta' -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw "Con la porta occupata il programma non è uscito" }
          Get-Content C:\gf-prova-porta\log\errori-avvio.log
          & C:\GestionaleFarmacia\disinstalla-servizio.ps1
          if (Get-ScheduledTask -TaskName 'Gestionale Farmacia' -ErrorAction SilentlyContinue) { throw "Attività non rimossa" }

      - uses: actions/upload-artifact@v4
        with:
          name: GestionaleFarmacia-win-x64
          path: dist/GestionaleFarmacia/
          if-no-files-found: error
