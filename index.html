<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NefroCenter Pharmacy</title>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#14294F">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%231C4184'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='%23fff'/%3E%3Ccircle cx='25' cy='7' r='4' fill='%23E10717'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/caratteri.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/scanner.css">
  <link rel="stylesheet" href="css/tour.css">
  <link rel="stylesheet" href="css/guide.css">
  <link rel="stylesheet" href="css/cruscotto.css">
  <link rel="stylesheet" href="css/logistica.css">
  <link rel="stylesheet" href="css/struttura.css">
  <link rel="stylesheet" href="css/analisi.css">
  <link rel="stylesheet" href="css/sistema.css">
  <link rel="stylesheet" href="css/sicurezza.css">
</head>
<body>
  <!-- schermate di accesso (primo amministratore, accesso, cambio password): le disegna js/accesso.js -->
  <div class="accesso" id="accesso">
    <div class="accesso-scheda"><p class="accesso-attesa">Collegamento al server…</p></div>
  </div>

  <div class="app" id="app" hidden>
    <aside class="laterale" id="laterale">
      <div class="marchio" id="marchio"></div>
      <nav class="menu" id="menu" aria-label="Menu principale"></nav>
      <div class="laterale-piede" id="stato-archivio"></div>
    </aside>

    <div class="principale">
      <div class="testa-fissa">
        <header class="barra">
          <button class="btn-menu" id="apri-menu" type="button" aria-label="Apri il menu">☰</button>
          <div class="barra-titolo">
            <h1 id="titolo-pagina">Oggi</h1>
            <p id="data-oggi"></p>
          </div>
          <button class="ricerca-rapida" id="apri-ricerca" type="button">
            <span>🔍 Cerca un articolo…</span><kbd>Ctrl K</kbd>
          </button>
          <button class="guidami" id="guidami" type="button" title="Guida sullo schermo: ti mostro passo per passo cosa fare in questa pagina">🧭 <span>Guidami</span></button>
          <div class="utente-menu" id="utente-menu">
            <button class="utente-btn" id="utente-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="utente-tendina"></button>
            <div class="utente-tendina" id="utente-tendina" role="menu" aria-label="Menu dell’utente" hidden>
              <div class="utente-chi" id="utente-chi" role="presentation"></div>
              <button type="button" role="menuitem" id="utente-password">🔑 Cambia password</button>
              <button type="button" role="menuitem" id="utente-sicurezza" hidden>🔐 Sicurezza dell’account</button>
              <div class="utente-separatore" role="separator"></div>
              <div class="utente-tema-titolo" role="presentation">Tema dello schermo</div>
              <div class="utente-tema" role="group" aria-label="Tema dello schermo">
                <button type="button" role="menuitemradio" aria-checked="false" data-scegli-tema="chiaro" title="Sfondo chiaro"><span aria-hidden="true">☀️</span>Chiaro</button>
                <button type="button" role="menuitemradio" aria-checked="false" data-scegli-tema="scuro" title="Sfondo scuro, per gli ambienti poco illuminati"><span aria-hidden="true">🌙</span>Scuro</button>
                <button type="button" role="menuitemradio" aria-checked="false" data-scegli-tema="automatico" title="Come le impostazioni del computer"><span aria-hidden="true">🖥️</span>Automatico</button>
              </div>
              <div class="utente-separatore" role="separator"></div>
              <button type="button" role="menuitem" id="utente-esci">🚪 Esci</button>
            </div>
          </div>
          <div class="collegamento" id="collegamento" aria-live="polite"></div>
        </header>
        <!-- banda discreta: altri utenti hanno cambiato i dati mentre si scrive -->
        <div class="aggiornamenti" id="aggiornamenti" role="status" hidden>
          <span id="aggiornamenti-testo"></span>
          <button class="btn piccolo primario" type="button" id="aggiornamenti-btn">Aggiorna</button>
          <button class="btn piccolo fantasma" type="button" id="aggiornamenti-chiudi" aria-label="Nascondi">✕</button>
        </div>
      </div>

      <main class="contenuto" id="contenuto" tabindex="-1"></main>
    </div>
  </div>

  <div class="velo" id="velo" hidden></div>
  <div class="modale" id="modale" role="dialog" aria-modal="true" aria-labelledby="modale-titolo" hidden></div>
  <div class="ricerca" id="ricerca" role="dialog" aria-modal="true" aria-label="Ricerca rapida" hidden>
    <input id="ricerca-testo" type="search" placeholder="Scrivi il nome di un articolo o di una pagina…" autocomplete="off">
    <ul id="ricerca-risultati"></ul>
    <p class="ricerca-aiuto">↑ ↓ per scegliere · Invio per aprire · Esc per chiudere</p>
  </div>
  <div class="avvisi" id="avvisi" aria-live="polite"></div>

  <script src="vendor/exceljs.min.js"></script>
  <script src="vendor/echarts.min.js"></script>
  <script src="vendor/anime.umd.min.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="js/modello.js"></script>
  <script src="js/calcoli.js"></script>
  <script src="js/previsioni.js"></script>
  <script src="js/totp.js"></script>
  <script src="js/codice128.js"></script>
  <script src="js/excel.js"></script>
  <script src="js/app.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/grafici.js"></script>
  <script src="js/api.js"></script>
  <script src="js/accesso.js"></script>
  <script src="js/barcode.js"></script>
  <script src="js/pagine.js"></script>
  <script src="js/amministrazione.js"></script>
  <script src="js/scanner.js"></script>
  <script src="js/tour.js"></script>
  <script src="js/guide.js"></script>
  <script src="js/pagine-cruscotto.js"></script>
  <script src="js/pagine-logistica.js"></script>
  <script src="js/armadio-vista.js"></script>
  <script src="js/pagine-struttura.js"></script>
  <script src="js/pagine-configura.js"></script>
  <script src="js/pagine-analisi.js"></script>
  <script src="js/excel-ordini.js"></script>
  <script src="js/pagine-sistema.js"></script>
  <script src="js/sicurezza.js"></script>
  <script src="js/avvio.js"></script>
</body>
</html>
