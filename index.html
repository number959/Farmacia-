<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestionale Farmacia · Clinica Posillipo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e5a6e'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="laterale" id="laterale">
      <div class="marchio" id="marchio"></div>
      <nav class="menu" id="menu" aria-label="Menu principale"></nav>
      <div class="laterale-piede" id="stato-archivio"></div>
    </aside>

    <div class="principale">
      <header class="barra">
        <button class="btn-menu" id="apri-menu" type="button" aria-label="Apri il menu">☰</button>
        <div class="barra-titolo">
          <h1 id="titolo-pagina">Oggi</h1>
          <p id="data-oggi"></p>
        </div>
        <button class="ricerca-rapida" id="apri-ricerca" type="button">
          <span>🔍 Cerca un articolo…</span><kbd>Ctrl K</kbd>
        </button>
        <div class="operatore" id="operatore" title="Operatore che registra i movimenti (Configura)"></div>
        <div class="salvataggio" id="salvataggio" aria-live="polite"></div>
      </header>

      <main class="contenuto" id="contenuto" tabindex="-1"></main>
    </div>
  </div>

  <div class="velo" id="velo" hidden></div>
  <div class="modale" id="modale" role="dialog" aria-modal="true" aria-labelledby="modale-titolo" hidden></div>
  <div class="ricerca" id="ricerca" role="dialog" aria-modal="true" aria-label="Ricerca rapida" hidden>
    <input id="ricerca-testo" type="search" placeholder="Scrivi il nome di un articolo o di una pagina…" autocomplete="off">
    <ul id="ricerca-risultati"></ul>
    <p class="ricerca-aiuto">↑ ↓ per scegliere · Invio per aprire · Esc per chiudere</p>
  </div>
  <div class="avvisi" id="avvisi" aria-live="polite"></div>

  <script src="vendor/exceljs.min.js"></script>
  <script src="js/modello.js"></script>
  <script src="js/calcoli.js"></script>
  <script src="js/archivio.js"></script>
  <script src="js/excel.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pagine.js"></script>
  <script src="js/demo.js"></script>
  <script>App.avvia();</script>
</body>
</html>
